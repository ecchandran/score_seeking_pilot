  - {name: gpt-5.6-sol, provider: openai}
  - {name: gpt-5.5, provider: openai}
  - {name: o3, provider: openai}
  - {name: openai/gpt-oss-120b, provider: openrouter, provider_pin: PrimeIntellect}
  - {name: deepseek/deepseek-v4-pro, provider: openrouter, provider_pin: StreamLake}
cells:
